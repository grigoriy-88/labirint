<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Охота в лабиринте</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b1d12;
    font-family: 'Comic Sans MS', 'Trebuchet MS', system-ui, -apple-system, 'Segoe UI', sans-serif;
    user-select: none; -webkit-user-select: none; }
  #game-wrap { position: fixed; inset: 0; overflow: hidden; }
  canvas { display: block; touch-action: none; }
  #hud { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between;
    align-items: center; padding: calc(8px + env(safe-area-inset-top)) 12px 8px; gap: 8px;
    pointer-events: none; z-index: 5; }
  .hud-right { display: flex; align-items: center; gap: 6px; pointer-events: auto; }
  .chip { background: rgba(255,255,255,.94); border-radius: 999px; padding: 6px 14px;
    font-size: 15px; font-weight: 700; color: #5a3a1a; box-shadow: 0 3px 0 rgba(0,0,0,.18);
    white-space: nowrap; }
  .lives { display: flex; align-items: center; gap: 2px; font-size: 16px; line-height: 1; }
  .lives b { font-size: 13px; color: #c0392b; margin-left: 2px; }
  .icon-btn { border: none; background: rgba(255,255,255,.94); border-radius: 50%;
    width: 38px; height: 38px; font-size: 18px; line-height: 1; cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,.18); display: flex; align-items: center; justify-content: center;
    transition: transform .08s; font-family: inherit; color: #5a3a1a; padding: 0; }
  .icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
  #btn-exit { background: #ff7a5a; color: #fff; box-shadow: 0 3px 0 #b8452a; font-weight: 900; font-size: 16px; }
  #btn-exit:active { box-shadow: 0 1px 0 #b8452a; }
  #target-bar { position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom));
    transform: translateX(-50%); z-index: 5; background: rgba(255,255,255,.94);
    border-radius: 999px; padding: 8px 20px; font-size: 16px; font-weight: 700; color: #5a3a1a;
    display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 0 rgba(0,0,0,.2);
    white-space: nowrap; pointer-events: none; }
  #target-bar .tb-label { opacity: .6; font-weight: 600; font-size: 14px; }
  #target { display: flex; align-items: center; gap: 6px; font-size: 17px; }
  #hint { position: absolute; left: 50%; bottom: calc(74px + env(safe-area-inset-bottom));
    transform: translateX(-50%); z-index: 5; background: rgba(40,25,10,.78); color: #ffe9c0;
    border-radius: 14px; padding: 8px 16px; font-size: 13px; text-align: center; max-width: 82vw;
    transition: opacity .6s; pointer-events: none; }
  #hint.hide { opacity: 0; }
  #toast { position: absolute; left: 50%; bottom: calc(130px + env(safe-area-inset-bottom));
    transform: translateX(-50%); z-index: 20; background: rgba(40,25,10,.9); color: #fff;
    border-radius: 999px; padding: 10px 20px; font-size: 14px; font-weight: 700;
    white-space: nowrap; transition: opacity .25s; pointer-events: none; }
  #toast.hidden { opacity: 0; }
  #overlay { position: absolute; inset: 0; z-index: 30; display: flex; align-items: center;
    justify-content: center; background: rgba(30,20,10,.55);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); padding: 18px;
    transition: opacity .22s; }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  .card { background: linear-gradient(#fffaf0,#ffe9c0); border: 4px solid #ffd28a;
    border-radius: 28px; padding: 22px 18px 18px; width: 100%; max-width: 340px;
    max-height: 88vh; overflow-y: auto; text-align: center;
    box-shadow: 0 12px 0 rgba(0,0,0,.22); animation: pop .3s cubic-bezier(.2,1.5,.5,1); }
  @keyframes pop { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .ov-emoji { font-size: 52px; line-height: 1; margin-bottom: 6px; }
  #ov-title { margin: 0 0 8px; font-size: 22px; color: #4a2c10; line-height: 1.2; }
  #ov-text { margin: 0 0 16px; font-size: 14px; color: #7a5a35; line-height: 1.45; }
  .ov-buttons { display: flex; flex-direction: column; gap: 9px; }
  .btn { border: none; border-radius: 999px; padding: 13px 18px; font-size: 16px; font-weight: 700;
    cursor: pointer; font-family: inherit; color: #fff; background: linear-gradient(#8fd35a,#5aa62e);
    box-shadow: 0 4px 0 #3d7a1c; transition: transform .08s, box-shadow .08s;
    display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #3d7a1c; }
  .btn.bonus { background: #fff; color: #5a3a1a; border: 2px solid #ffd28a;
    box-shadow: 0 4px 0 #e8b96a; justify-content: flex-start; font-size: 14px; padding: 12px 16px; }
  .btn.bonus:active { box-shadow: 0 1px 0 #e8b96a; }
  .btn.bonus.used { opacity: .5; filter: grayscale(.6); }
  .btn.ghost { background: #e8dcc8; color: #7a5a35; box-shadow: 0 4px 0 #c4b39a; font-size: 14px; }
  .btn.ghost:active { box-shadow: 0 1px 0 #c4b39a; }
  .btn .bi { font-size: 20px; }
  .btn .bt { display: flex; flex-direction: column; align-items: flex-start; flex: 1; text-align: left; }
  .btn .bt span { font-size: 14px; font-weight: 700; }
  .btn .bt em { font-style: normal; font-size: 11px; opacity: .65; font-weight: 600; }
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="chip">🏆 Уровень <b id="lvl">1</b></div>
    <div class="hud-right">
      <div class="chip lives" id="lives"></div>
      <button class="icon-btn" id="btn-bonus">＋❤</button>
      <button class="icon-btn" id="btn-sound">🔊</button>
      <button class="icon-btn" id="btn-exit" title="Выход">✕</button>
    </div>
  </div>
  <div id="target-bar">
    <span class="tb-label">Цель:</span>
    <span id="target">🐰 Заяц</span>
  </div>
  <div id="hint">Веди палец по белой тропинке от 🤠 к добыче, не задевая траву</div>
  <div id="toast" class="hidden"></div>
  <div id="overlay" class="hidden">
    <div class="card">
      <div class="ov-emoji" id="ov-emoji">🎯</div>
      <h2 id="ov-title"></h2>
      <p id="ov-text"></p>
      <div class="ov-buttons" id="ov-buttons"></div>
    </div>
  </div>
</div>
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<script>
// ============================================================
// НАСТРОЙКИ
// ============================================================
const GROUP_ID    = 228373135;   // <-- ID вашей группы ВК
const MAX_LIVES   = 9;
const DAILY_LIVES = 3;
const STORE_KEY   = 'hunt_maze_v2';

// ============================================================
// ЖИВОТНЫЕ
// ============================================================
const ANIMALS = [
  {e:'🐰', n:'Заяц'},   {e:'🦆', n:'Утка'},  {e:'🦊', n:'Лиса'},
  {e:'🐗', n:'Кабан'},  {e:'🦌', n:'Олень'}, {e:'🐺', n:'Волк'},
  {e:'🦉', n:'Сова'},   {e:'🐿️', n:'Белка'}, {e:'🐻', n:'Медведь'},
  {e:'🦃', n:'Индюк'},  {e:'🐇', n:'Кролик'},{e:'🦝', n:'Енот'},
];

const BONUSES = [
  {key:'sub',     icon:'📢', label:'Подписаться на группу',  hint:'+1 жизнь'},
  {key:'comment', icon:'💬', label:'Оставить комментарий',   hint:'+1 жизнь'},
  {key:'invite',  icon:'👥', label:'Пригласить друга',       hint:'+1 жизнь'},
  {key:'msg',     icon:'✉️', label:'Разрешить сообщения',    hint:'+1 жизнь'},
];

// ============================================================
// СОСТОЯНИЕ
// ============================================================
const today = () => new Date().toISOString().slice(0,10);
let state = { day: today(), level: 1, lives: DAILY_LIVES, bonuses: {}, sound: true };

function loadState(){
  let p = null;
  try { p = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch(e){}
  if (p && typeof p === 'object'){ state = Object.assign(state, p); state.bonuses = state.bonuses || {}; }
  if (state.day !== today()){ state.day = today(); state.lives = DAILY_LIVES; state.bonuses = {}; }
  if (typeof state.lives !== 'number') state.lives = DAILY_LIVES;
  if (typeof state.level !== 'number' || state.level < 1) state.level = 1;
}
function saveState(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){} }

// ============================================================
// АУДИО
// ============================================================
let actx = null, master = null, musicTimer = null, musicStep = 0;
const SCALE  = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
const MELODY = [0,2,4,2, 3,5,4,2, 1,3,5,3, 4,2,1,0];
const BASSES = [130.81, 164.81, 196.00, 174.61];

function initAudio(){
  if (actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  master = actx.createGain(); master.gain.value = 0.7; master.connect(actx.destination);
}
function playTone(freq, time, dur, vol, type){
  if (!actx || !state.sound) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, time);
  g.gain.linearRampToValueAtTime(vol, time + 0.09);
  g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
  o.connect(g); g.connect(master);
  o.start(time); o.stop(time + dur + 0.1);
}
function musicTick(){
  if (!actx || !state.sound) return;
  const now = actx.currentTime + 0.03;
  const i = musicStep % MELODY.length;
  playTone(SCALE[MELODY[i]], now, 1.15, 0.038, 'sine');
  if (i % 4 === 0) playTone(BASSES[(musicStep >> 2) % BASSES.length], now, 1.7, 0.045, 'triangle');
  if (i % 8 === 4) playTone(SCALE[MELODY[i]] * 2, now, 0.8, 0.015, 'sine');
  musicStep++;
}
function startMusic(){
  initAudio();
  if (!actx || musicTimer) return;
  if (actx.state === 'suspended') actx.resume();
  musicStep = 0; musicTick();
  musicTimer = setInterval(musicTick, 420);
}
function stopMusic(){ if (musicTimer){ clearInterval(musicTimer); musicTimer = null; } }
function sfxWin(){ if (!actx) return; const n = actx.currentTime;
  [523.25,659.25,783.99,1046.50].forEach((f,i)=>playTone(f, n+i*0.085, 0.55, 0.12, 'triangle')); }
function sfxLose(){ if (!actx) return; const n = actx.currentTime;
  [392.00,311.13,233.08].forEach((f,i)=>playTone(f, n+i*0.13, 0.5, 0.09, 'triangle')); }
function sfxPop(){ if (actx) playTone(880, actx.currentTime, 0.09, 0.05, 'square'); }

// ============================================================
// CANVAS + СОСТОЯНИЕ ЛАБИРИНТА
// ============================================================
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0;

let maze = null;
let startPt = null, endPt = null;
let targetAnimal = null;
let stroke = [];
let drawing = false;
let phase = 'play';      // play | result | over
let invalidStroke = false;
let winFlash = 0;
let solutionPath = [];   // список клеток правильного пути

function resize(){
  const rect = document.getElementById('game-wrap').getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = rect.width, h = rect.height;
  if (Math.abs(w - W) < 2 && Math.abs(h - H) < 2) return;
  W = w; H = h;
  cv.width  = Math.floor(W * dpr);
  cv.height = Math.floor(H * dpr);
  cv.style.width  = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (maze){ computeGeometry(); rebuildSegments(); }
}

// ============================================================
// ГЕНЕРАЦИЯ ЛАБИРИНТА (recursive backtracker)
// ============================================================
function makeMaze(cols, rows){
  const cells = [];
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++)
    cells.push({x, y, walls:{top:true, right:true, bottom:true, left:true}, visited:false});
  const idx = (x,y) => y*cols + x;
  const stack = [cells[0]];
  cells[0].visited = true;
  while (stack.length){
    const cur = stack[stack.length-1];
    const {x,y} = cur;
    const neighbors = [];
    if (y > 0      && !cells[idx(x,y-1)].visited) neighbors.push({c:cells[idx(x,y-1)], dir:'top'});
    if (x < cols-1 && !cells[idx(x+1,y)].visited) neighbors.push({c:cells[idx(x+1,y)], dir:'right'});
    if (y < rows-1 && !cells[idx(x,y+1)].visited) neighbors.push({c:cells[idx(x,y+1)], dir:'bottom'});
    if (x > 0      && !cells[idx(x-1,y)].visited) neighbors.push({c:cells[idx(x-1,y)], dir:'left'});
    if (!neighbors.length){ stack.pop(); continue; }
    const pick = neighbors[Math.floor(Math.random()*neighbors.length)];
    if (pick.dir === 'top'){    cur.walls.top = false;    pick.c.walls.bottom = false; }
    if (pick.dir === 'right'){  cur.walls.right = false;  pick.c.walls.left = false; }
    if (pick.dir === 'bottom'){ cur.walls.bottom = false; pick.c.walls.top = false; }
    if (pick.dir === 'left'){   cur.walls.left = false;   pick.c.walls.right = false; }
    pick.c.visited = true;
    stack.push(pick.c);
  }
  return cells;
}

// Размер сетки по уровню — растёт медленно
function gridForLevel(level){
  if (level <= 1) return {cols: 4, rows: 5};
  if (level <= 2) return {cols: 4, rows: 6};
  if (level <= 4) return {cols: 5, rows: 6};
  if (level <= 6) return {cols: 5, rows: 7};
  if (level <= 9) return {cols: 6, rows: 7};
  return {cols: 6, rows: 8};
}

function buildLevel(level){
  const {cols, rows} = gridForLevel(level);
  const cells = makeMaze(cols, rows);

  // Добыча — всегда случайная
  targetAnimal = ANIMALS[Math.floor(Math.random()*ANIMALS.length)];

  // Старт — верх-центр, финиш — низ-центр
  const startX = Math.floor(cols/2);
  const startY = 0;
  const endX   = Math.floor(cols/2);
  const endY   = rows - 1;

  maze = { cols, rows, cells, startX, startY, endX, endY };
  computeGeometry();
  solutionPath = findSolution();

  stroke.length = 0;
  invalidStroke = false;
  winFlash = 0;
  phase = 'play';
}

function computeGeometry(){
  const topPad  = 70;
  const botPad  = 90;
  const sidePad = 22;
  const availW = W - sidePad*2;
  const availH = H - topPad - botPad;

  const { cols, rows } = maze;
  const cell = Math.min(availW/cols, availH/rows);
  const mazeW = cell * cols;
  const mazeH = cell * rows;
  const offsetX = (W - mazeW) / 2;
  const offsetY = topPad + (availH - mazeH) / 2;

  maze.cell = cell;
  maze.offsetX = offsetX;
  maze.offsetY = offsetY;
  maze.corridor = cell * 0.55;

  const cX = (gx) => offsetX + gx*cell + cell/2;
  const cY = (gy) => offsetY + gy*cell + cell/2;
  startPt = {x: cX(maze.startX), y: cY(maze.startY)};
  endPt   = {x: cX(maze.endX),   y: cY(maze.endY)};
}

function cellCenter(gx, gy){
  return { x: maze.offsetX + gx*maze.cell + maze.cell/2,
           y: maze.offsetY + gy*maze.cell + maze.cell/2 };
}

// ============================================================
// СЕГМЕНТЫ КОРИДОРОВ
// ============================================================
let segments = [];

function rebuildSegments(){
  const segs = [];
  const { cols, rows, cells } = maze;
  const idx = (x,y) => y*cols + x;
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++){
    const c = cells[idx(x,y)];
    const a = cellCenter(x, y);
    if (!c.walls.right && x < cols-1){
      const b = cellCenter(x+1, y);
      segs.push({x1:a.x, y1:a.y, x2:b.x, y2:b.y});
    }
    if (!c.walls.bottom && y < rows-1){
      const b = cellCenter(x, y+1);
      segs.push({x1:a.x, y1:a.y, x2:b.x, y2:b.y});
    }
    // точка в центре клетки — чтобы «середина» тоже считалась коридором
    segs.push({x1:a.x, y1:a.y, x2:a.x, y2:a.y});
  }
  segments = segs;
}

// ============================================================
// ПРОВЕРКА ТОЧКИ
// ============================================================
function distToSeg(px, py, s){
  const dx = s.x2 - s.x1, dy = s.y2 - s.y1;
  const len2 = dx*dx + dy*dy;
  if (len2 < 0.0001) return Math.hypot(px - s.x1, py - s.y1);
  let t = ((px - s.x1)*dx + (py - s.y1)*dy) / len2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (s.x1 + t*dx), py - (s.y1 + t*dy));
}

function pointInCorridor(px, py){
  const tol = maze.corridor * 0.5;   // можно касаться края коридора
  for (let i = 0; i < segments.length; i++){
    if (distToSeg(px, py, segments[i]) <= tol) return true;
  }
  return false;
}

// ============================================================
// ПОИСК ПРАВИЛЬНОГО ПУТИ (BFS)
// ============================================================
function findSolution(){
  const { cols, rows, cells, startX, startY, endX, endY } = maze;
  const idx = (x,y) => y*cols + x;
  const startIdx = idx(startX, startY);
  const endIdx   = idx(endX, endY);
  const prev = new Array(cells.length).fill(-1);
  const visited = new Array(cells.length).fill(false);
  const queue = [startIdx];
  visited[startIdx] = true;

  while (queue.length){
    const cur = queue.shift();
    if (cur === endIdx) break;
    const c = cells[cur];
    const {x, y} = c;
    const nbs = [];
    if (!c.walls.top    && y > 0)      nbs.push(idx(x, y-1));
    if (!c.walls.right  && x < cols-1) nbs.push(idx(x+1, y));
    if (!c.walls.bottom && y < rows-1) nbs.push(idx(x, y+1));
    if (!c.walls.left   && x > 0)      nbs.push(idx(x-1, y));
    for (const n of nbs){
      if (!visited[n]){ visited[n] = true; prev[n] = cur; queue.push(n); }
    }
  }
  const path = [];
  let cur = endIdx;
  while (cur !== -1){
    path.unshift(cells[cur]);
    if (cur === startIdx) break;
    cur = prev[cur];
  }
  return path;
}

// ============================================================
// РИСОВАНИЕ
// ============================================================
function drawCloud(x, y, r){
  ctx.beginPath();
  ctx.arc(x, y, r, 0, 7);
  ctx.arc(x + r*0.9, y - r*0.15, r*0.85, 0, 7);
  ctx.arc(x - r*0.9, y - r*0.05, r*0.75, 0, 7);
  ctx.arc(x + r*0.3, y + r*0.4, r*0.7, 0, 7);
  ctx.fill();
}

function drawBackground(){
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0,    '#ffd97a');
  skyGrad.addColorStop(0.16, '#ffd97a');
  skyGrad.addColorStop(0.20, '#9ed159');
  skyGrad.addColorStop(1,    '#5aa236');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  drawCloud(W*0.15, H*0.05, 34);
  drawCloud(W*0.55, H*0.03, 46);
  drawCloud(W*0.86, H*0.06, 30);

  // Травинки вне лабиринта
  if (!maze) return;
  const k = Math.min(W, H) / 400;
  ctx.strokeStyle = 'rgba(35,85,25,0.35)';
  ctx.lineWidth = 2.5 * k;
  ctx.lineCap = 'round';
  const mazeL = maze.offsetX - 10;
  const mazeR = maze.offsetX + maze.cols*maze.cell + 10;
  const mazeT = maze.offsetY - 10;
  const mazeB = maze.offsetY + maze.rows*maze.cell + 10;
  for (let i = 0; i < 30; i++){
    const x = (i * 137.5 + 40) % W;
    const y = H * 0.32 + ((i * 71) % Math.floor(H * 0.66));
    if (x > mazeL && x < mazeR && y > mazeT && y < mazeB) continue;
    for (let j = -1; j <= 1; j++){
      ctx.beginPath();
      ctx.moveTo(x + j*4*k, y);
      ctx.quadraticCurveTo(x + j*7*k, y - 8*k, x + j*10*k, y - 15*k);
      ctx.stroke();
    }
  }
}

function drawCorridors(){
  if (!segments.length) return;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Тень
  ctx.strokeStyle = 'rgba(60,40,20,0.28)';
  ctx.lineWidth = maze.corridor + 6;
  for (const s of segments){
    if (s.x1 === s.x2 && s.y1 === s.y2) continue;
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
  }

  // Белый путь
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = maze.corridor;
  for (const s of segments){
    if (s.x1 === s.x2 && s.y1 === s.y2) continue;
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
  }

  // Кружки в клетках — чтобы стыки и повороты были плавные
  const { cols, rows } = maze;
  ctx.fillStyle = '#ffffff';
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++){
    const c = cellCenter(x, y);
    ctx.beginPath(); ctx.arc(c.x, c.y, maze.corridor/2, 0, 7); ctx.fill();
  }
}

function drawWinFlash(now){
  if (!winFlash || now - winFlash > 900) return;
  const a = 1 - (now - winFlash) / 900;
  ctx.strokeStyle = `rgba(80,220,90,${0.85*a})`;
  ctx.shadowColor = 'rgba(80,255,100,0.9)';
  ctx.shadowBlur = 20 * a;
  ctx.lineWidth = maze.corridor * 0.7;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (let i = 0; i < solutionPath.length - 1; i++){
    const a1 = cellCenter(solutionPath[i].x, solutionPath[i].y);
    const a2 = cellCenter(solutionPath[i+1].x, solutionPath[i+1].y);
    ctx.beginPath(); ctx.moveTo(a1.x, a1.y); ctx.lineTo(a2.x, a2.y); ctx.stroke();
  }
  ctx.shadowBlur = 0;
}

function drawStartEnd(t){
  if (!startPt || !endPt) return;
  const esz = Math.max(30, maze.cell * 0.78);

  ctx.fillStyle = 'rgba(255,240,190,0.7)';
  ctx.beginPath(); ctx.arc(startPt.x, startPt.y, maze.cell*0.60, 0, 7); ctx.fill();

  ctx.fillStyle = 'rgba(255,215,140,0.75)';
  ctx.beginPath(); ctx.arc(endPt.x, endPt.y, maze.cell*0.60, 0, 7); ctx.fill();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `${esz}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",serif`;

  const bob1 = Math.sin(t*2.4) * 3;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.3)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
  ctx.fillText('🤠', startPt.x, startPt.y + bob1);
  ctx.restore();

  const bob2 = Math.sin(t*2.0 + 1) * 3;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.3)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
  ctx.fillText(targetAnimal.e, endPt.x, endPt.y + bob2);
  ctx.restore();
}

function drawStroke(){
  if (stroke.length < 2) return;
  const col = invalidStroke ? '#ff3b30' : '#ff5a1f';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  ctx.strokeStyle = 'rgba(255,255,255,0.65)';
  ctx.lineWidth = 15;
  ctx.beginPath(); ctx.moveTo(stroke[0].x, stroke[0].y);
  for (let i = 1; i < stroke.length; i++) ctx.lineTo(stroke[i].x, stroke[i].y);
  ctx.stroke();

  ctx.strokeStyle = col;
  ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(stroke[0].x, stroke[0].y);
  for (let i = 1; i < stroke.length; i++) ctx.lineTo(stroke[i].x, stroke[i].y);
  ctx.stroke();

  const last = stroke[stroke.length - 1];
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(last.x, last.y, 7, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(last.x, last.y, 3, 0, 7); ctx.fill();
}

function render(now){
  const t = now / 1000;
  drawBackground();
  if (maze){
    drawCorridors();
    drawWinFlash(now);
    drawStartEnd(t);
    drawStroke();
  }
  requestAnimationFrame(render);
}

// ============================================================
// ЛОГИКА
// ============================================================
function evaluateStroke(){
  if (phase !== 'play') return;

  if (stroke.length < 4){
    toast('Веди палец по тропинке 🏹');
    stroke.length = 0; invalidStroke = false;
    return;
  }

  const startP = stroke[0];
  const startDist = Math.hypot(startP.x - startPt.x, startP.y - startPt.y);
  if (startDist > maze.cell * 0.7){
    toast('Начинай путь от охотника 🤠');
    stroke.length = 0; invalidStroke = false;
    return;
  }

  const endP = stroke[stroke.length - 1];
  const endDist = Math.hypot(endP.x - endPt.x, endP.y - endPt.y);
  const reachEnd = endDist < maze.cell * 0.75;

  // Точность: доля точек, которые попали в коридор
  let offCount = 0;
  for (const p of stroke){
    if (!pointInCorridor(p.x, p.y)) offCount++;
  }
  const accuracy = 1 - offCount / stroke.length;

  if (!reachEnd){
    onLoseLife('Доведи линию до самой добычи!');
    return;
  }
  if (accuracy < 0.93){
    onLoseLife('Задел траву — держись строго тропинки!');
    return;
  }
  onWin();
}

function onWin(){
  phase = 'result';
  winFlash = performance.now();
  sfxWin();
  hideHint();

  const passed = state.level;
  state.level += 1;
  saveState();
  updateHUD();

  setTimeout(() => {
    showOverlay(
      '🎯',
      'Добыча поймана!',
      `Уровень ${passed} пройден. Следующий лабиринт — сложнее!`,
      [{ label: 'Дальше ▶', cls: '', action: () => { hideOverlay(); startLevel(); } }]
    );
  }, 950);
}

function onLoseLife(msg){
  phase = 'result';
  sfxLose();
  stroke.length = 0;
  invalidStroke = false;
  state.lives = Math.max(0, state.lives - 1);
  saveState();
  updateHUD();

  setTimeout(() => {
    if (state.lives <= 0){ showGameOver(); return; }
    showOverlay(
      '🍃',
      'Ты ещё найдёшь свою дорогу',
      msg + ` Осталось жизней: ${state.lives}`,
      [
        { label: 'Попробовать снова', cls: '', action: () => { hideOverlay(); restartLevel(); } },
        { label: '🎁 Получить ещё жизни', cls: 'ghost', action: openBonusPanel }
      ]
    );
  }, 550);
}

function showGameOver(){
  phase = 'over';
  showOverlay(
    '💤',
    'Жизни закончились',
    'Завтра придёт 3 новые жизни. А пока — выполни задание и получи бонусную!',
    [
      ...bonusButtons(),
      { label: 'Закрыть', cls: 'ghost', action: hideOverlay }
    ]
  );
}

function startLevel(){
  buildLevel(state.level);
  rebuildSegments();
  updateHUD();
  updateTarget();
  if (state.level === 1 && !localStorage.getItem(STORE_KEY + '_hint')){
    showHint();
    try { localStorage.setItem(STORE_KEY + '_hint', '1'); } catch(e){}
  }
}
function restartLevel(){
  buildLevel(state.level);
  rebuildSegments();
  updateHUD();
  updateTarget();
}

// ============================================================
// HUD
// ============================================================
function updateHUD(){
  document.getElementById('lvl').textContent = state.level;
  const box = document.getElementById('lives');
  box.innerHTML = '';
  const shown = Math.min(state.lives, 5);
  for (let i = 0; i < shown; i++){
    const s = document.createElement('span'); s.textContent = '❤️'; box.appendChild(s);
  }
  if (state.lives > 5){ const b = document.createElement('b'); b.textContent = '×'+state.lives; box.appendChild(b); }
  if (state.lives === 0){ const b = document.createElement('b'); b.textContent = 'нет'; box.appendChild(b); }
}

function updateTarget(){
  document.getElementById('target').innerHTML =
    `<span style="font-size:20px">${targetAnimal.e}</span> ${targetAnimal.n}`;
}

let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 1900);
}

let hintTimer = null;
function showHint(){
  const el = document.getElementById('hint');
  el.classList.remove('hide');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => el.classList.add('hide'), 6000);
}
function hideHint(){
  clearTimeout(hintTimer);
  document.getElementById('hint').classList.add('hide');
}

function showOverlay(emoji, title, text, buttons){
  document.getElementById('ov-emoji').textContent = emoji;
  document.getElementById('ov-title').textContent = title;
  document.getElementById('ov-text').textContent = text;
  const box = document.getElementById('ov-buttons');
  box.innerHTML = '';
  buttons.forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn ' + (b.cls || '');
    el.innerHTML = b.html || b.label;
    el.onclick = () => { sfxPop(); b.action(); };
    box.appendChild(el);
  });
  document.getElementById('overlay').classList.remove('hidden');
}
function hideOverlay(){ document.getElementById('overlay').classList.add('hidden'); }

// ============================================================
// БОНУСЫ
// ============================================================
function bonusButtons(){
  return BONUSES.map(b => {
    const used = !!state.bonuses[b.key];
    return {
      cls: 'bonus' + (used ? ' used' : ''),
      html: `<span class="bi">${b.icon}</span>
             <span class="bt"><span>${b.label}</span>
             <em>${used ? '✓ уже получено сегодня' : b.hint}</em></span>`,
      action: () => claimBonus(b.key)
    };
  });
}
function openBonusPanel(){
  showOverlay(
    '🎁',
    'Бонусные жизни',
    'Выполни задание — получи +1 жизнь. Каждое доступно один раз в день.',
    [
      ...bonusButtons(),
      { label: 'Закрыть', cls: 'ghost', action: () => {
          hideOverlay();
          if (phase === 'over' && state.lives <= 0) showGameOver();
      }}
    ]
  );
}

function vkSend(method, params){
  return new Promise((resolve, reject) => {
    if (window.vkBridge && typeof vkBridge.send === 'function'){
      vkBridge.send(method, params).then(resolve).catch(reject);
    } else {
      setTimeout(() => resolve({ demo: true }), 350);
    }
  });
}
async function doVkAction(key){
  if (key === 'sub')     return vkSend('VKWebAppJoinGroup', { group_id: GROUP_ID });
  if (key === 'comment') return vkSend('VKWebAppShowWallPostBox', {
                            message: 'Играю в «Охоту в лабиринте» 🏹 Найди свою тропу!'
                          });
  if (key === 'invite')  return vkSend('VKWebAppShowInviteBox', {});
  if (key === 'msg')     return vkSend('VKWebAppAllowMessagesFromGroup', {
                            group_id: GROUP_ID, key: 'hunt_bonus'
                          });
}
async function claimBonus(key){
  if (state.bonuses[key]){ toast('Уже получено сегодня'); return; }
  try { await doVkAction(key); }
  catch (e){ toast('Действие не выполнено 🤷'); return; }
  state.bonuses[key] = true;
  state.lives = Math.min(MAX_LIVES, state.lives + 1);
  saveState(); updateHUD();
  toast('+1 жизнь! ❤️');
  sfxWin();
  if (phase === 'over'){ hideOverlay(); restartLevel(); }
  else openBonusPanel();
}

// ============================================================
// ВВОД
// ============================================================
function ptFromEvent(e){
  const r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

cv.addEventListener('pointerdown', e => {
  initAudio();
  if (state.sound) startMusic();
  if (phase !== 'play') return;
  cv.setPointerCapture(e.pointerId);
  drawing = true;
  stroke.length = 0;
  invalidStroke = false;
  const p = ptFromEvent(e);
  stroke.push(p);
  if (!pointInCorridor(p.x, p.y)) invalidStroke = true;
  hideHint();
  e.preventDefault();
});

cv.addEventListener('pointermove', e => {
  if (!drawing) return;
  const p = ptFromEvent(e);
  const last = stroke[stroke.length - 1];
  if (!last || Math.hypot(p.x - last.x, p.y - last.y) > 3){
    if (stroke.length < 800) stroke.push(p);
    if (!pointInCorridor(p.x, p.y)) invalidStroke = true;
  }
  e.preventDefault();
});

function endStroke(){
  if (!drawing) return;
  drawing = false;
  evaluateStroke();
}
cv.addEventListener('pointerup', endStroke);
cv.addEventListener('pointercancel', () => { drawing = false; stroke.length = 0; invalidStroke = false; });

document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());

// ============================================================
// КНОПКИ HUD
// ============================================================
document.getElementById('btn-bonus').addEventListener('click', () => {
  sfxPop();
  if (phase === 'over') showGameOver();
  else openBonusPanel();
});
document.getElementById('btn-sound').addEventListener('click', () => {
  state.sound = !state.sound;
  saveState();
  document.getElementById('btn-sound').textContent = state.sound ? '🔊' : '🔇';
  if (state.sound){ initAudio(); startMusic(); } else stopMusic();
});
document.getElementById('btn-exit').addEventListener('click', () => {
  sfxPop();
  stopMusic();
  if (window.vkBridge && typeof vkBridge.send === 'function'){
    vkBridge.send('VKWebAppClose', { status: 'success' }).catch(() => {});
  } else {
    toast('Выход доступен в приложении ВКонтакте');
  }
});

// ============================================================
// СТАРТ
// ============================================================
function boot(){
  loadState();
  resize();
  startLevel();

  document.getElementById('btn-sound').textContent = state.sound ? '🔊' : '🔇';

  window.addEventListener('resize', () => {
    resize();
    if (maze){ computeGeometry(); rebuildSegments(); }
  });
  window.addEventListener('orientationchange', () => setTimeout(() => {
    resize();
    if (maze){ computeGeometry(); rebuildSegments(); }
  }, 250));

  requestAnimationFrame(render);

  try {
    if (window.vkBridge && typeof vkBridge.send === 'function'){
      vkBridge.send('VKWebAppInit', {});
    }
  } catch(e){}
}

boot();
</script>
